services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    network_mode: bridge
    environment:
      # 代理只由各 Stack 的环境变量提供：NAS 配 HTTP(S)_PROXY，VPS 不配（直连）。这里只引用变量，不写死地址。
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - WATCHTOWER_NOTIFICATIONS_LEVEL=${WATCHTOWER_NOTIFICATIONS_LEVEL}
      - WATCHTOWER_NOTIFICATION_REPORT=${WATCHTOWER_NOTIFICATION_REPORT}
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    command: ["--label-enable", "--cleanup", "--schedule", "${WATCHTOWER_SCHEDULE}"]
    entrypoint: ["/watchtower"]
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
    labels:
      - "com.centurylinklabs.watchtower=true"
      - "com.centurylinklabs.watchtower.enable=true"
